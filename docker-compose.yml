version: '3.8'

services:
  # 1. MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: seckill-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: seckill_db 
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql # 数据持久化，防止重启丢失

  # 2. Redis 缓存
  redis:
    image: redis:7.0-alpine
    container_name: seckill-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes # 开启 AOF 持久化

  # 3. RabbitMQ 消息队列 (带网页管理控制台)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: seckill-rabbitmq
    ports:
      - "5672:5672"   # Go 代码连接 MQ 的通信端口
      - "15672:15672" # 浏览器访问的管理控制台端口
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
  etcd:
    image: bitnami/etcd:3.5
    container_name: seckill-etcd
    ports:
      - "2379:2379"
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://0.0.0.0:2379
    volumes:
      - etcd_data:/bitnami/etcd/data
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: seckill-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
  prometheus:
    image: prom/prometheus:latest
    container_name: seckill-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml

# 定义数据卷
volumes:
  mysql_data:
  redis_data:
  rabbitmq_data: